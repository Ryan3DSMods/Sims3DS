# Builds sims.3dsx + sims.cia with devkitPro and packs dist/Sims3DS-<version>.zip (tools/release/make_release.sh).
#   - push a tag v1.0, v1.1, ...          -> builds and publishes the GitHub release with the zip attached
#   - Actions tab > "Build release" > Run -> builds only; the zip is downloadable as a workflow artifact
# No game data is involved anywhere: the zip holds only the engine, the extractor and the licences.
name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the zip name (e.g. 1.0)'
        required: false
        default: 'test'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04          # Python 3.12 for the 3D banner (pycgfx)
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install devkitPro (3ds-dev, from the official devkitpro/devkitarm image)
        run: |
          trap 'echo "::error::failed: $BASH_COMMAND"' ERR
          docker pull -q devkitpro/devkitarm:latest
          sudo mkdir -p /opt/devkitpro
          docker run --rm -v /opt/devkitpro:/out devkitpro/devkitarm:latest \
            sh -c 'cp -a /opt/devkitpro/. /out/ 2>/tmp/cp.err || { cat /tmp/cp.err | tail -5; exit 1; }' 2>&1 | tee cp.log \
            || { echo "::error::$(tail -5 cp.log | tr '\n' ' ')"; exit 1; }
          sudo chown -R "$USER" /opt/devkitpro
          ls /opt/devkitpro /opt/devkitpro/devkitARM/bin | head -20
          test -x /opt/devkitpro/devkitARM/bin/arm-none-eabi-g++ || { echo "::error::no compiler: $(ls /opt/devkitpro | tr '\n' ' ')"; exit 1; }
          echo "/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Install makerom and bannertool
        run: |
          trap 'echo "::error::failed: $BASH_COMMAND"' ERR
          mkdir -p "$HOME/bin" dl
          T=$(gh api repos/3DSGuy/Project_CTR/releases --jq '[.[] | select(any(.assets[]; .name | test("makerom.*ubuntu.*x86_64")))][0].tag_name')
          echo "makerom release: $T"
          gh release download "$T" -R 3DSGuy/Project_CTR --pattern '*makerom*ubuntu*x86_64*.zip' -D dl/makerom
          gh release download -R diasurgical/bannertool --pattern '*.zip' -D dl/bannertool
          for z in dl/makerom/*.zip dl/bannertool/*.zip; do unzip -q -o "$z" -d "${z%.zip}"; done
          cp "$(find dl/makerom -type f -name makerom | head -1)" "$HOME/bin/makerom"
          cp "$(find dl/bannertool -type f -name bannertool -path '*linux*x86_64*' | head -1)" "$HOME/bin/bannertool"
          chmod +x "$HOME/bin/makerom" "$HOME/bin/bannertool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          arm-none-eabi-gcc --version | head -1
          makerom 2>&1 | head -2 || true
          bannertool 2>&1 | head -2 || true
          python3 --version

      - name: Build the release zip
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          set -o pipefail
          tools/release/make_release.sh "$V" 2>&1 | tee build.log
          grep -q "cia: using the 3D banner" build.log || { echo "::error::3D banner step failed (flat banner used)"; exit 1; }
          ls -la dist/

      - name: Show the end of the build log as an annotation (on failure)
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          msg=$(tail -c 3500 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build.log tail::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: Sims3DS-${{ env.VERSION }}
          path: dist/Sims3DS-${{ env.VERSION }}.zip

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Sims3DS $VERSION" --notes-file .github/release-notes.md
          gh release upload "$GITHUB_REF_NAME" "dist/Sims3DS-$VERSION.zip" --clobber
